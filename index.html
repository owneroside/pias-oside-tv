<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play It Again Sports Oceanside</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;cursor:none;font-family:"Arial Black",Impact,Arial,sans-serif}
#bg{position:fixed;inset:0;background:linear-gradient(120deg,#ff2d6f,#ff8a00,#ffd400,#00c2ff,#7b2dff);background-size:400% 400%;animation:g 24s ease infinite}
@keyframes g{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#bg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 40px,transparent 40px 80px)}
#stage{position:fixed;left:3.5vw;top:5vh;height:90vh;width:90vh;transition:opacity .6s}
#stage img{width:100%;height:100%;object-fit:contain;border-radius:1.5vh;box-shadow:0 2vh 6vh rgba(0,0,0,.45)}
#side{position:fixed;left:calc(3.5vw + 90vh + 3vw);right:3.5vw;top:5vh;bottom:5vh;display:flex;flex-direction:column;justify-content:space-between}
#brand{color:#fff;text-shadow:0 .6vh 0 rgba(0,0,0,.35);font-size:6.2vh;line-height:1.05;text-transform:uppercase}
#brand small{display:block;font-size:3.4vh;margin-top:1.5vh;font-family:Arial,sans-serif;font-weight:900}
#policy{background:#0b1d3a;color:#fff;border:.7vh solid #ffd400;border-radius:2vh;padding:3vh 3vh;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:3.5vh;line-height:1.3;box-shadow:0 1.5vh 4vh rgba(0,0,0,.4)}
#policy b{display:block;color:#ffd400;font-family:"Arial Black",Arial;font-size:3.6vh;margin-bottom:1.2vh;letter-spacing:.1vh}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
body.vid #policy,body.vid #side,body.vid #stage{visibility:hidden}
</style></head><body>
<div id="bg"></div><div id="stage"><img id="img" alt=""></div>
<div id="side"><div id="brand">Play It Again Sports<small>Oceanside &bull; 1220 S Coast Hwy &bull; @piasoside</small></div>
<div id="policy"><b>RETURN POLICY</b><span id="ptext">New items: returns within 14 days with receipt and original packaging (up to 15% restocking fee). Used, marked down, special orders and services: all sales final.</span></div></div>
<video id="vid" muted playsinline preload="auto"></video>
<script>
let M=null,i=0,t=null;const img=document.getElementById('img'),vid=document.getElementById('vid'),st=document.getElementById('stage');
async function load(){try{const r=await fetch('manifest.json?'+Date.now(),{cache:'no-store'});const j=await r.json();if(j.items&&j.items.length)M=j;if(j.returnPolicy)document.getElementById('ptext').textContent=j.returnPolicy}catch(e){}}
function next(){clearTimeout(t);if(!M){t=setTimeout(async()=>{await load();next()},5000);return}
 if(i>=M.items.length){i=0;load()} // refresh manifest each loop
 const it=M.items[i++];
 if(it.type==='video'){document.body.classList.add('vid');vid.style.display='block';vid.src=it.src;vid.muted=true;
  const done=()=>{vid.onended=vid.onerror=null;vid.pause();vid.style.display='none';document.body.classList.remove('vid');next()};
  vid.onended=done;vid.onerror=done;vid.play().catch(done);t=setTimeout(done,(it.maxSeconds||20)*1000);}
 else{const n=new Image();n.onload=()=>{st.style.opacity=0;setTimeout(()=>{img.src=it.src;st.style.opacity=1},600);t=setTimeout(next,(it.seconds||M.defaultSeconds||10)*1000)};n.onerror=()=>next();n.src=it.src}}
load().then(next);setTimeout(()=>location.reload(),6*3600*1000);
</script></body></html>

name: assets
# Keeps assets.json (content hashes the TV's service worker diffs against) in step with main.
on:
  push:
    branches: [main]
    paths-ignore: ['assets.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/build-assets.py
            git diff --quiet -- assets.json && { echo "assets.json already current"; exit 0; }
            git add assets.json && git commit -qm "assets.json: refresh hashes"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

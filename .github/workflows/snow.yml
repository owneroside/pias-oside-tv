name: snow
# Refreshes snow.json for the live snow-report slide. Runs every 30 minutes.
# Does not bump version.txt, so the TV asset sync is not triggered; the
# player fetches snow.json network-first (listed in sw.js NET).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/fetch-snow.py"
      - ".github/workflows/snow.yml"
permissions:
  contents: write
concurrency:
  group: snow
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch snow report
        run: python3 tools/fetch-snow.py
      - name: Commit if conditions changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snow.json
          git diff --quiet --cached -- snow.json && { echo "snow.json unchanged"; exit 0; }
          git commit -qm "snow.json: refresh mountain conditions"
          for n in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            sleep 10
            git pull --rebase --autostash origin main || true
          done
          exit 1

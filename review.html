<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIAS TV slide review</title>
<style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif}#w{height:calc(100% - 48px);display:flex;align-items:center;justify-content:center}#w img,#w video{max-width:100%;max-height:100%;object-fit:contain;background:#000}#b{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}button{font-size:18px;padding:6px 18px}#t{font-size:14px;opacity:.8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}</style></head>
<body><div id="w"></div><div id="b"><button onclick="go(-1)">&larr; Prev</button><span id="t"></span><button onclick="go(1)">Next &rarr;</button></div>
<script>
let L=[],i=0,seq=0;
fetch('manifest.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(m=>{L=[...(m.items||[]),...(m.dated||[])].filter(e=>e.src).map(e=>e.full?{...e,src:e.full}:e);i=Math.min(L.length-1,Math.max(0,(+location.hash.slice(1)||1)-1));show()});
function release(el){if(!el)return;if(el.pause)el.pause();el.removeAttribute('src');if(el.load)el.load();el.remove()}
function show(){const my=++seq,e=L[i],w=document.getElementById('w');if(!e)return;release(w.querySelector('video,img'));const v=/\.(mp4|webm|mov)$/i.test(e.src);const el=document.createElement(v?'video':'img');if(v){el.muted=el.defaultMuted=el.loop=el.autoplay=el.playsInline=true;el.preload='auto';el.setAttribute('playsinline','');el.setAttribute('muted','')}else el.alt='';el.addEventListener('error',()=>{if(my!==seq||el.dataset.retried)return;el.dataset.retried='1';el.src=e.src+(e.src.indexOf('?')>=0?'&':'?')+'r='+Date.now()});el.src=e.src;w.appendChild(el);if(v){const p=el.play();if(p&&p.catch)p.catch(function(){})}document.getElementById('t').textContent=(i+1)+' / '+L.length+'  '+e.src.split('/').pop()+(e.start?'  (dated '+e.start+' to '+e.end+')':'');location.hash=i+1}
function go(d){if(!L.length)return;i=(i+d+L.length)%L.length;show()}
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key==' '){e.preventDefault();go(1)}if(e.key=='ArrowLeft')go(-1)});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(dx<0?1:-1);x0=null});
</script></body></html>
